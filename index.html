<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="English IPA">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>English IPA 路 鑻辫瀛︿範</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="theme-light">
  <header class="topbar">
    <div class="brand">English <span>IPA</span><small id="brand-version" class="brand-version"></small></div>
    <nav class="tabs">
      <button class="tab active" data-tab="query">鏌ヨ</button>
      <button class="tab" data-tab="chart">闊崇礌琛?/button>
      <button class="tab" data-tab="library">鎴戠殑</button>
      <button class="tab" data-tab="settings">璁剧疆</button>
    </nav>
  </header>

  <main>
    <section id="tab-query" class="panel active">
      <div class="search-card">
        <textarea id="input" rows="3" placeholder="杈撳叆鑻辨枃鍗曡瘝鎴栧彞瀛愶紝渚嬪 hello / How are you?"></textarea>
        <div class="search-row">
          <span class="hint">鍗曡瘝璧拌瘝鍏革紝鍙ュ瓙璧扮炕璇戯紱鏈€澶?500 瀛楃</span>
          <button id="analyze-btn" class="btn primary">鏌ヨ</button>
        </div>
      </div>
      <div id="query-status" class="status"></div>
      <div id="result"></div>
    </section>

    <section id="tab-chart" class="panel">
      <div class="chart-toolbar">
        <input id="chart-search" class="input" placeholder="鎼滅储闊崇礌鎴栦緥璇?>
        <div class="segmented">
          <button class="seg active" data-view="vowel">鍏冮煶</button>
          <button class="seg" data-view="consonant">杈呴煶</button>
          <button class="seg" data-view="diphthong">鍙屽厓闊?/button>
          <button class="seg" data-view="ipa">缇庡紡闊虫爣琛?/button>
        </div>
      </div>
      <div id="chart-body"></div>
    </section>

    <section id="tab-library" class="panel">
      <div class="library-head">
        <div class="segmented" id="library-segments">
          <button class="seg active" data-segment="history">鍘嗗彶</button>
          <button class="seg" data-segment="wordbook">鐢熻瘝鏈?/button>
          <button class="seg" data-segment="favorites">鏀惰棌</button>
        </div>
        <button class="link" id="to-settings">瀵煎叆瀵煎嚭</button>
      </div>
      <div id="library-body"></div>
    </section>

    <section id="tab-settings" class="panel">
      <div class="card">
        <h3>瑙嗚椋庢牸</h3>
        <div class="chips" id="theme-row">
          <button class="chip" data-theme="light">A 娓呯埥</button>
          <button class="chip" data-theme="paper">B 绾歌川</button>
          <button class="chip" data-theme="dark">C 鏆楄壊</button>
          <button class="chip" data-theme="auto">D 璺熼殢绯荤粺</button>
        </div>
      </div>

      <div class="card">
        <h3>瀵煎嚭</h3>
        <div class="chips" id="export-scopes">
          <label class="check"><input type="checkbox" value="wordbook" checked> 鐢熻瘝鏈?/label>
          <label class="check"><input type="checkbox" value="history" checked> 鍘嗗彶</label>
          <label class="check"><input type="checkbox" value="favorites" checked> 鏀惰棌</label>
        </div>
        <div class="chips">
          <label class="check"><input type="radio" name="format" value="json" checked> JSON</label>
          <label class="check"><input type="radio" name="format" value="csv"> CSV</label>
        </div>
        <button id="export-btn" class="btn primary">涓嬭浇瀵煎嚭鏂囦欢</button>
      </div>

      <div class="card">
        <h3>瀵煎叆</h3>
        <button id="import-btn" class="btn">閫夋嫨鏂囦欢</button>
        <div id="import-info" class="muted"></div>
      </div>

      <div class="card">
        <h3>鏁版嵁</h3>
        <button id="clear-btn" class="btn danger">娓呯┖鍏ㄩ儴鏁版嵁</button>
      </div>
    </section>
  </main>

  <div id="phoneme-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <button id="modal-symbol" class="modal-symbol" type="button" title="鎾斁闊崇礌"></button>
        <button class="icon" data-close>脳</button>
      </div>
      <div id="modal-tip" class="modal-tip"></div>
      <div class="modal-title">渚嬭瘝</div>
      <div id="modal-examples"></div>
      <div class="modal-title">甯歌鎷煎啓</div>
      <div id="modal-spell" class="muted"></div>
      <div class="modal-actions">
        <button id="modal-play" class="btn primary">鎾斁闊崇礌</button>
        <button id="modal-chart" class="btn">鍦ㄩ煶绱犺〃涓煡鐪?/button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.bundle.js?v=6"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!window.__swReloaded) {
            window.__swReloaded = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
